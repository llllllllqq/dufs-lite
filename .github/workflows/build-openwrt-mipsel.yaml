name: Build No-TLS OpenWrt mipsel

on:
  workflow_dispatch:

env:
  TARGET: mipsel-unknown-linux-musl
  # Official OpenWrt 25.12.5 toolchain for ramips/mt7620 (mipsel_24kc, soft-float)
  TOOLCHAIN_URL: https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt7620/openwrt-toolchain-25.12.5-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: Build mipsel-24kc-no-tls
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # All MIPS Rust targets are Tier 3: no prebuilt std is published, so we
      # need nightly + rust-src to compile std from source (-Z build-std).
      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install zstd and qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd qemu-user-static

      # MT7620 is a MIPS 24KEc (MIPS32r2, no FPU). Rust's
      # mipsel-unknown-linux-musl is mips32r2 + soft-float, so the matching
      # toolchain is OpenWrt's mipsel_24kc one (also soft-float).
      - name: Install OpenWrt toolchain
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/toolchain.tar.zst "$TOOLCHAIN_URL"
          mkdir -p /opt/openwrt
          tar --zstd -xf /tmp/toolchain.tar.zst -C /opt/openwrt
          TC_DIR="$(find /opt/openwrt -maxdepth 2 -type d -name 'toolchain-mipsel_24kc*' | head -1)"
          test -n "$TC_DIR"
          CC="$(ls "$TC_DIR"/bin/*-gcc | head -1)"
          test -n "$CC"
          {
            echo "TC_DIR=$TC_DIR"
            echo "PATH=$TC_DIR/bin:$PATH"
            echo "STAGING_DIR=/opt/openwrt"
            echo "CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=$CC"
            echo "CC_mipsel_unknown_linux_musl=$CC"
            echo "AR_mipsel_unknown_linux_musl=$(ls "$TC_DIR"/bin/*-ar | head -1)"
          } >> "$GITHUB_ENV"
          echo "Using CC: $CC"
          "$CC" -v 2>&1 | tail -3 || true

      - name: Build (no TLS)
        run: |
          set -euxo pipefail
          cargo +nightly build \
            --locked --release \
            --target "$TARGET" \
            --no-default-features \
            -Z build-std=std,panic_abort

      - name: Inspect binary
        run: |
          set -euxo pipefail
          BIN="target/${TARGET}/release/dufs"
          file "$BIN"
          ls -lh "$BIN"
          echo "--- ELF header ---"
          readelf -h "$BIN" | grep -Ei "Class|Data|Machine|Type"
          echo "--- MIPS ABI flags (FP ABI must be Soft float) ---"
          readelf -A "$BIN" || true
          echo "--- dynamic deps (must be none) ---"
          readelf -d "$BIN" 2>/dev/null || echo "no dynamic section (static)"

      - name: Smoke test under qemu
        run: |
          set -euxo pipefail
          BIN="target/${TARGET}/release/dufs"
          chmod +x "$BIN"
          qemu-mipsel-static "$BIN" --version
          echo "binary executes OK under qemu-mipsel (ABI is consistent)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dufs-no-tls-mipsel-24kc
          path: target/mipsel-unknown-linux-musl/release/dufs
