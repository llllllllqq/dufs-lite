name: Build No-TLS OpenWrt mipsel

on:
  workflow_dispatch:

env:
  TARGET: mipsel-unknown-linux-musl
  # Official OpenWrt 25.12.5 toolchain for ramips/mt7620 (mipsel_24kc, soft-float)
  TOOLCHAIN_URL: https://downloads.openwrt.org/releases/25.12.5/targets/ramips/mt7620/openwrt-toolchain-25.12.5-ramips-mt7620_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    name: Build mipsel-24kc-no-tls
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      # All MIPS Rust targets are Tier 3: no prebuilt std is published, so we
      # need nightly + rust-src to compile std from source (-Z build-std).
      - name: Install nightly Rust with rust-src
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install zstd and qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd qemu-user-static

      # MT7620 is a MIPS 24KEc (MIPS32r2, no FPU). Rust's
      # mipsel-unknown-linux-musl is mips32r2 + soft-float, so the matching
      # toolchain is OpenWrt's mipsel_24kc one (also soft-float).
      - name: Install OpenWrt toolchain
        run: |
          set -euxo pipefail
          curl -fsSL -o /tmp/toolchain.tar.zst "$TOOLCHAIN_URL"
          mkdir -p /opt/openwrt
          tar --zstd -xf /tmp/toolchain.tar.zst -C /opt/openwrt
          TC_DIR="$(find /opt/openwrt -maxdepth 2 -type d -name 'toolchain-mipsel_24kc*' | head -1)"
          CC="$(ls "$TC_DIR"/bin/*-gcc | head -1)"
          {
            echo "TC_DIR=$TC_DIR"
            echo "GCC_LIB_DIR=$(dirname "$(find "$TC_DIR" -name libgcc.a | head -1)")"
            echo "SYSROOT=$(dirname "$(dirname "$(find "$TC_DIR" -name 'ld-musl-mipsel-sf.so.1' | head -1)")")"
            echo "PATH=$TC_DIR/bin:$PATH"
            echo "STAGING_DIR=/opt/openwrt"
            echo "CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER=$CC"
            echo "CC_mipsel_unknown_linux_musl=$CC"
            echo "AR_mipsel_unknown_linux_musl=$(ls "$TC_DIR"/bin/*-ar | head -1)"
          } >> "$GITHUB_ENV"
          echo "Using CC: $CC"

      # rustc always asks for -lunwind when linking musl statically, but OpenWrt
      # uses libgcc for unwinding and ships no libunwind.a. libgcc_eh.a provides
      # the same Itanium _Unwind_* ABI, so expose it under the name rustc wants.
      - name: Provide libunwind shim
        run: |
          set -euxo pipefail
          mkdir -p /tmp/unwind-shim
          cp "$GCC_LIB_DIR/libgcc_eh.a" /tmp/unwind-shim/libunwind.a
          ls -l /tmp/unwind-shim

      - name: Build static (preferred)
        id: static
        continue-on-error: true
        env:
          # - crt-static: mipsel-unknown-linux-musl defaults to a *dynamic* PIE.
          # - link-self-contained=no: a Tier 3 target ships no bundled crt
          #   objects, so let the OpenWrt gcc provide crt1.o/crti.o/libc.a.
          #   (rust-lang/rust#120655)
          RUSTFLAGS: >-
            -C target-feature=+crt-static
            -C link-self-contained=no
            -C link-arg=-L/tmp/unwind-shim
            -C link-arg=-lgcc
        run: |
          set -euxo pipefail
          cargo +nightly build \
            --locked --release \
            --target "$TARGET" \
            --no-default-features \
            -Z build-std=std,panic_abort
          mkdir -p dist
          cp "target/$TARGET/release/dufs" dist/dufs

      - name: Build dynamic (fallback)
        if: steps.static.outcome != 'success'
        run: |
          set -euxo pipefail
          cargo +nightly build \
            --locked --release \
            --target "$TARGET" \
            --no-default-features \
            -Z build-std=std,panic_abort
          mkdir -p dist
          cp "target/$TARGET/release/dufs" dist/dufs

      - name: Inspect and smoke test
        run: |
          set -euxo pipefail
          BIN=dist/dufs
          file "$BIN"
          ls -lh "$BIN"
          echo "--- ELF header ---"
          readelf -h "$BIN" | grep -Ei "Class|Data|Machine|Type"
          echo "--- MIPS ABI flags (expect ISA MIPS32r2 / FP ABI Soft float) ---"
          readelf -A "$BIN" | grep -Ei "ISA|FP ABI|GPR size"
          echo "--- dynamic section ---"
          if readelf -d "$BIN" 2>/dev/null | grep -q NEEDED; then
            echo "VARIANT: dynamic (links against the router's musl)"
            readelf -d "$BIN" | grep NEEDED || true
            qemu-mipsel-static -L "$SYSROOT" "$BIN" --version
          else
            echo "VARIANT: static (self-contained)"
            qemu-mipsel-static "$BIN" --version
          fi
          echo "smoke test OK: binary executes under qemu-mipsel"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dufs-no-tls-mipsel-24kc
          path: dist/dufs
